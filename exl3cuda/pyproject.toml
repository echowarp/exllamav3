[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "exl3cuda"
version = "0.1.0"
description = "EXL3 (exllamav3) quantized models in vLLM on NVIDIA CUDA (RTX 5090): plugin, kernels, engine patches"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.entry-points."vllm.general_plugins"]
exl3cuda = "exl3cuda.vllm_plugin:register"

[tool.setuptools]
packages = ["exl3cuda"]
package-dir = { "exl3cuda" = ".", "" = "." }
py-modules = ["llmt_lazyvis"]

[tool.setuptools.package-data]
exl3cuda = ["lib/*.so", "lib/*/*.so"]
